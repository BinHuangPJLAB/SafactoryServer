# 该目录需要同步到 initialization.yaml 中 gateway.config_source_dir 指向的共享盘。
listen_host: 0.0.0.0
listen_port: 8000
base_session_path: /v1/sessions
max_steps: -1

storage_type: cloud
storage_config: {}

telemetry:
  mode: strict
  loss_policy: fail_closed
  capture_payload: full
  payload_sample_rate: 1.0
  redact_sensitive_fields: true
  batch_size: 200
  flush_interval_ms: 100

request_log:
  enabled: true
  path: /app/logs/gateway_requests.jsonl
  max_bytes: 104857600
  backup_count: 5
  body_limit_bytes: 0

# 按实际模型服务修改；不要把真实 api_key 提交到 Git。部署时应在同步到共享盘
# 的副本中填入 Secret，或使用 Gateway 所支持的 Secret 注入机制。
llm_routes:
  kimi-k3:
    base_url: http://replace-with-model-service/v1
    api_key: null
    supports_stream: true
    max_concurrency: 256
