schema_version: "1.0"

models:
  - model_id: model_glm_001
    name: GLM Route
    available: true
    internal:
      route: glm-internal
      credential_ref: secret/model-glm
  - model_id: model_qwen_001
    name: Qwen Route
    available: true
    internal:
      route: qwen-internal
      credential_ref: secret/model-qwen
  - model_id: model_archived_001
    name: Archived Route
    available: false
    internal:
      route: archived-internal

ranges:
  - range_id: range_web_001
    available: true
    supported_models:
      - model_glm_001
      - model_qwen_001
    scenario_id: web_happy
  - range_id: range_glm_only_001
    available: true
    supported_models:
      - model_glm_001
    scenario_id: web_happy
  - range_id: range_maintenance_001
    available: false
    availability_retryable: true
    supported_models:
      - model_glm_001
    scenario_id: web_happy

scenarios:
  web_happy:
    preparing_after_ms: 100
    sessions:
      - fixture_id: primary
        visible_after_ms: 300
        result:
          running_after_ms: 500
          completed_after_ms: 1500
          score: 8.5
        steps:
          - fixture_id: open_page
            visible_after_ms: 650
            duration_ms: 120
            trajectory:
              model_input:
                headers:
                  authorization: Bearer mock-fixture-secret
                messages:
                  - role: user
                    content: Open the target page.
              model_output:
                content: I will open the target page.
                tool_calls:
                  - name: browser.navigate
                    arguments:
                      url: https://example.test/
              action:
                type: navigate
                url: https://example.test/
              observation:
                title: Example Target
                url: https://example.test/
          - fixture_id: submit_form
            visible_after_ms: 1000
            duration_ms: 180
            trajectory:
              model_input:
                messages:
                  - role: user
                    content: Complete the sample form.
              model_output:
                content: The form is ready to submit.
                tool_calls:
                  - name: browser.click
                    arguments:
                      selector: button[type=submit]
              action:
                type: click
                selector: button[type=submit]
              observation:
                message: Form submitted successfully.
      - fixture_id: secondary
        visible_after_ms: 700
        result:
          running_after_ms: 900
          completed_after_ms: 2000
          score: 9.0
        steps:
          - fixture_id: inspect_page
            visible_after_ms: 1100
            duration_ms: 140
            trajectory:
              model_input:
                messages:
                  - role: user
                    content: Inspect the target page.
              model_output:
                content: I found the requested control.
                tool_calls: []
              action:
                type: inspect
              observation:
                control_found: true
          - fixture_id: finish_task
            visible_after_ms: 1500
            duration_ms: 160
            trajectory:
              model_input:
                messages:
                  - role: user
                    content: Finish the task.
              model_output:
                content: The task is complete.
                tool_calls: []
              action:
                type: finish
              observation:
                completed: true
