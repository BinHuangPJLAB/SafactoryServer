[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "safactory-job-server"
version = "0.2.0"
description = "Safactory Job Server with durable RJob orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "brainpp",
    "fastapi>=0.115,<1",
    "pydantic>=2.12,<3",
    "PyYAML>=6,<7",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[project.scripts]
safactory-job-server = "server.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
server = ["auth/*.yaml", "configs/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
