environments:
  - env_name: browser
    # 内置 smoke runner 只依赖 Python，可直接复用 safactory003 验证完整 RJob 链路。
    env_image: registry.h.pjlab.org.cn/ailab-evobox-evobox_proxy/server:safactory003
    env_num: 1
    dataset: ./datasets/smoke.jsonl
    env_params:
      locale: zh-CN
      safactory_results_root: /app/results
