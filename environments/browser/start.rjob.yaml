agent_name: browser
container:
  workdir: /app
  runner_entrypoint:
    source: ./runner.py
    target: /app/runner.py
    command: python /app/runner.py
rjob:
  charged_group: evobox_proxy
  private_machine: Group
  image_pull_policy: Always
  no_packaging: true
  cleanup_on_finish: true
  poll_interval_s: 5
  resources:
    cpu: 2
    gpu: 0
    memory_in_mb: 4096
  # source 会在 Job env 快照中被 Server 改写为配置化的 results.rjob_source/job_id。
  mount_config:
    - managed-results-placeholder:/app/results
